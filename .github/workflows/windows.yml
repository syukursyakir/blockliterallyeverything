name: Windows Jev installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recover_run:
        description: Recover numeric accounting from a completed live run without inference
        type: string
        required: false
      publish_alpha:
        description: Publish or replace the alpha installer after all Windows checks pass
        type: boolean
        default: false
      live_detection:
        description: Run opt-in real capture and Jev detection without building or publishing an installer
        type: boolean
        default: false
      capture_only:
        description: Capture public pages for encrypted local review, with no model calls
        type: boolean
        default: false
      capture_targets:
        description: Explicit public URL targets JSON (1 to 24)
        type: string
        required: false
      capture_public_key:
        description: Public RSA key for encrypted screenshot transport (never a private key)
        type: string
        required: false
      live_scene:
        description: Controlled integration scene; public sources are reviewed repeats, not new accuracy samples
        type: choice
        options:
          - social-synthetic
          - youtube-public
          - explicit-public
          - explicit-video
          - activity30-video
          - activity24-video
          - activity27-video
          - safe-video
          - youtube-video
          - youtube-compact-video
        default: social-synthetic
      positive_at_start:
        description: Explicit single-request positive-at-session-start protocol (no active-session transition claim)
        type: boolean
        default: false
      live_motion:
        description: Controlled motion or stale-result test; full active-session protocol only
        type: choice
        options: [none, pan, pan-wide, switch-away, video, video-safe, video-fast, video-safe-fast, video-switch-away]
        default: none
      live_audit:
        description: Encrypt actual submitted frames to capture_public_key and retain numeric scores for failure diagnosis
        type: boolean
        default: false
      live_trials:
        description: One trial or six fixed diagnostic replications, never an until-success retry loop
        type: choice
        options: ['1', '6']
        default: '1'
      retained_budget:
        description: Exact retained evaluation budget JSON; coordinate exclusive ownership before dispatch
        type: string
        required: false
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name != 'workflow_dispatch' || (!inputs.live_detection && !inputs.capture_only && !inputs.recover_run)
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: npm run test:desktop
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and smoke packaged app
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*setup.exe | Select-Object -First 1
          $install = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited $($install.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Recurse -Filter 'Block Literally Everything.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Installed application missing' }
          $env:BLE_SMOKE_APP_EXE = $exe.FullName
          npm run test:desktop:extended
          if ($LASTEXITCODE -ne 0) { throw 'Installed app smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-jev-installer-unsigned
          path: release/*setup.exe
          if-no-files-found: error
      - name: Upload desktop test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-test-evidence
          path: |
            desktop-test-results/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish verified alpha download
        if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release/*setup.exe | Select-Object -First 1
          $digest = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"
          gh release upload v0.1.0-alpha.1 $installer.FullName "$($installer.FullName).sha256" --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
          gh release edit v0.1.0-alpha.1 --draft=false --prerelease --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }

  live-detection:
    if: github.event_name == 'workflow_dispatch' && inputs.live_detection && !inputs.capture_only && !inputs.recover_run
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Refuse publishing, missing accounting or missing provider secret
        shell: pwsh
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish_alpha }}
          RETAINED_BUDGET: ${{ inputs.retained_budget }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if ($env:PUBLISH_REQUESTED -eq 'true') { throw 'Live detection never publishes a release.' }
          if (-not $env:RETAINED_BUDGET) { throw 'Retained accounting is required; no new allowance.' }
          if ([string]::IsNullOrWhiteSpace($env:TYPESAFE_API_KEY)) { throw 'Repository Actions secret TYPESAFE_API_KEY is unavailable. Add it under repository Settings > Secrets and variables > Actions.' }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - name: Prepare controlled scene and retained ledger copy
        run: node scripts/prepare-windows-live.mjs native-live
        env:
          BLE_RETAINED_BUDGET: ${{ inputs.retained_budget }}
          BLE_LIVE_POSITIVE_AT_START: ${{ inputs.positive_at_start }}
          BLE_LIVE_SCENE: ${{ inputs.live_scene }}
      - name: Real capture, live Jev, native cover and recovery
        run: node scripts/test-live-series.mjs --trials ${{ inputs.live_trials || '1' }} --allow-cloud --corpus native-live/manifest.json --case native-${{ inputs.live_scene || 'social-synthetic' }} --ledger native-live/budget.json --output native-live/report.json --motion ${{ inputs.live_motion || 'none' }} ${{ inputs.positive_at_start && '--positive-at-start' || '' }} ${{ inputs.live_audit && '--audit' || '' }}
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BLE_CAPTURE_PUBLIC_KEY: ${{ inputs.capture_public_key }}
      - name: Preserve numerical evidence and accounting only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-live-detection-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-live/report.json
            native-live/report.json.audit.enc.json
            native-live/report.json.series.json
            native-live/series/*/report.json
            native-live/series/*/report.json.audit.enc.json
            native-live/series/*/report.json.profile/jev-budget.json
            native-live/budget.json
            native-live/report.json.profile/jev-budget.json
          if-no-files-found: warn
          retention-days: 7

  capture-public:
    if: github.event_name == 'workflow_dispatch' && inputs.capture_only && !inputs.recover_run
    runs-on: windows-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Refuse release or mixed capture/inference mode
        shell: pwsh
        env:
          PUBLISH_REQUESTED: ${{ inputs.publish_alpha }}
          LIVE_REQUESTED: ${{ inputs.live_detection }}
        run: |
          if ($env:PUBLISH_REQUESTED -eq 'true' -or $env:LIVE_REQUESTED -eq 'true') { throw 'Capture-only mode never runs inference or publishes.' }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - name: Capture public pages and encrypt pixels for local review
        run: node scripts/capture-public-private.mjs private-captures
        env:
          BLE_CAPTURE_PUBLIC_KEY: ${{ inputs.capture_public_key }}
          BLE_CAPTURE_TARGETS: ${{ inputs.capture_targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: private-public-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            private-captures/captures.enc.json
            private-captures/status.json
          if-no-files-found: error
          retention-days: 2

  reconcile:
    if: github.event_name == 'workflow_dispatch' && inputs.recover_run && !inputs.live_detection && !inputs.capture_only && !inputs.publish_alpha
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate run ID
        env:
          RUN_ID: ${{ inputs.recover_run }}
        run: '[[ "$RUN_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@v4
        with:
          name: windows-live-detection-${{ inputs.recover_run }}-1
          path: recovered
          run-id: ${{ inputs.recover_run }}
          github-token: ${{ github.token }}
      - name: Verify and emit numeric accounting only
        shell: python
        run: |
          import json
          from pathlib import Path
          root = Path('recovered')
          reports = list(root.rglob('report.json'))
          profiles = [p for p in root.rglob('*') if p.is_file() and p.name.endswith('jev-budget.json')]
          assert len(reports) == len(profiles) == 1
          report = json.loads(reports[0].read_text())
          wrapper = json.loads((root / 'budget.json').read_text())
          profile = json.loads(profiles[0].read_text())
          assert not report.get('accountingError')
          assert report['budgetAfter'] == wrapper['current'] == profile
          assert 0 <= profile['requests'] - report['budgetBefore']['requests'] <= 3
          assert profile['reservedUsd'] <= wrapper['capUsd'] <= 3
          assert profile['inputTokens'] >= report['budgetBefore']['inputTokens']
          assert abs(profile['reservedUsd'] - profile['requests'] * 262144 * .042 / 1000000) < 1e-6
          print('VERIFIED_ACCOUNTING=' + json.dumps({'wrapper': wrapper, 'profile': profile, 'report': report}, separators=(',', ':')))
