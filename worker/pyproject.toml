[project]
name = "ble-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch>=2.6,<3", "torchvision>=0.21,<1", "transformers>=5.21,<6", "peft>=0.15,<1",
  "accelerate>=1,<2", "safetensors>=0.5,<1", "pillow>=11,<13",
  "huggingface-hub>=0.30,<2", "pyinstaller>=6,<7"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
